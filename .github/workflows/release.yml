name: Publish to npm

on:
  workflow_dispatch:

permissions:
  # contents: write is what lets the last step cut the GitHub Release. Publishing
  # to npm alone left the repository page advertising an old version as "Latest",
  # which reads as an abandoned project to anyone landing on it.
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish public package with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This name must match the npm Trusted Publisher configuration.
    environment: npm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js 24
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
        package-manager-cache: false

    - name: Install dependencies from lockfile
      run: npm ci

    - name: Verify release tag matches package version
      shell: bash
      run: |
        VERSION="$(node -p "require('./package.json').version")"
        if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
          echo "Expected workflow ref v$VERSION, got $GITHUB_REF"
          exit 1
        fi

    - name: Publish public package
      run: npm publish --access public --provenance

    # Runs only after npm accepted the package, so a GitHub Release never
    # announces a version nobody can install. The notes are the CHANGELOG
    # section for this version, which is written before the tag exists.
    - name: Cut the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      shell: bash
      run: |
        VERSION="${TAG#v}"
        # From this version's heading to the next one, minus that next heading.
        awk -v v="$VERSION" '
          $0 ~ "^## \\[" v "\\]" { in_section = 1; next }
          in_section && /^## \[/  { exit }
          in_section              { print }
        ' CHANGELOG.md > release-notes.md
        if [[ ! -s release-notes.md ]]; then
          echo "No CHANGELOG section for $VERSION; refusing to publish empty notes." >&2
          exit 1
        fi
        gh release create "$TAG" \
          --title "SkillHub $TAG" \
          --notes-file release-notes.md \
          --verify-tag \
          --latest
