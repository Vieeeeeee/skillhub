name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # Releases publish from Node 24, and prepublishOnly runs the suite there.
        # Leaving 24 out of the matrix meant the one Node version that runs the
        # tests at release time was the one CI never tried.
        node-version: [ 20.x, 22.x, 24.x ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies from lockfile
      run: npm ci

    - name: Run test suite
      run: npm test

    - name: Audit production dependencies
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
      run: npm audit --omit=dev --audit-level=high

    - name: Verify install artifact contents
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
      run: npm run pack:check
